[project]
name = "orch"
version = "0.26.5"
description = "Global orchestrator CLI for Claude Code and Codex sub-agents"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run on one worker per CPU (pytest-xdist). Pass -n0 to run in one process.
addopts = "-n auto"
# Test modules import helpers and other test modules by bare name across groups.
pythonpath = [
    "tests",
    "tests/agents",
    "tests/cli",
    "tests/core",
    "tests/execute",
    "tests/gate",
    "tests/ops",
    "tests/review_pr",
    "tests/schedule",
    "tests/session",
    "tests/track",
]

[tool.ruff]
target-version = "py314"
# The same directories as pytest's pythonpath, so imports across groups sort as first-party.
src = [
    "src",
    "tests",
    "tests/agents",
    "tests/cli",
    "tests/core",
    "tests/execute",
    "tests/gate",
    "tests/ops",
    "tests/review_pr",
    "tests/schedule",
    "tests/session",
    "tests/track",
]
include = ["**/*.py", "**/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]
