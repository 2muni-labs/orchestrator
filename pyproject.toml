[project]
name = "orch"
version = "0.6.0"
description = "Global orchestrator CLI for Claude Code and Codex sub-agents"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
include = ["**/*.py", "**/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
