# Verified agent versions and what must be measured again before a version moves
# (technical design 4.13, ADR 0019). orch versions and doctor agent_versions read this
# file from M19 (m-p5-versions); launcher moves its Claude Code version here then.
# From m-selfcheck, orch selfcheck runs the automatable remeasure items on a new
# version and switches only when they pass. Until then, changing a version is a
# harness pull request that records the new measurements.

[claude]
version = "2.1.319"
# Where the latest version is published (measured P5-M3, 2026-11-15, no auth):
# GET <url> returns HTTP 200 and the bare version string. Same source as install.sh.
latest_url = "https://downloads.claude.ai/claude-code-releases/latest"
remeasure = [
  "m14-cli: only exit 2 or a deny output blocks a PreToolUse hook",
  "S-M1: ! bash mode and PreToolUse; a finished pane falling back to a shell",
  "P5-M4: hook events that end a permission wait",
  "W-M2: session record location, run key and usage fields",
  "orch open: --append-system-prompt-file and agent injection; a resumed session keeps its first system prompt",
  "FL-M1: <ver>/manifest.json platforms.<platform>.checksum (sha256) and size match the binary; claude install switches ~/.local/bin/claude at once; versions/<ver> runs by absolute path",
]

[codex]
version = "0.160.0"
# npm registry: GET <url> returns HTTP 200 and JSON whose "version" is the latest.
latest_url = "https://registry.npmjs.org/@openai/codex/latest"
remeasure = [
  "codex-review-measure: exec exit codes, -o behaviour, --output-schema strictness",
  "isolation: --disable hooks --disable plugins leave no hooks or MCP servers",
  "usage limit message and rate_limits in the rollout (BLOCKED_QUOTA)",
  "P5-M5: read-only explore answer format, exit code, -o, usage per question",
  "S-M2: sandbox reads outside -C; wrapping in an outer sandbox-exec",
  "S-M2b: follows HTTPS_PROXY, hosts it connects to, works behind the allowlist proxy with only localhost:<port> open",
  "W-M1: rollout session_meta, token_count and rate_limits format",
  "FL-M2: mise install does not switch or lock; mise lock writes checksums without installing and prunes the old entry; a wrong checksum makes mise install exit 1; mise reads an ancestor ~/.config/mise when the cwd is under the home",
]

# tmux and macOS have no latest_url: orch versions compares the installed version
# (tmux -V, sw_vers -productVersion) with the pin only, and a mismatch is a warning.

[tmux]
version = "3.8"
remeasure = [
  "S-M1: a finished pane (argv command, remain-on-exit) never falls back to a shell; default key bindings that open a shell",
  "S-M3: pty attach to a dedicated -S socket inside the server profile; the default socket is denied",
  "orch terminal adapter: new-session/split-window/new-window -P -F '#{pane_id}', send-keys -l, pane_dead and pane_current_command formats",
  "main pane liveness check (doctor, orch open): quoting format of #{pane_start_command}, which terminal/tmux.py splits with shlex",
]

[macos]
version = "15.8.1"
remeasure = [
  "gate profile: tests/test_sandbox_real.py and tests/integration/test_sandbox_gate.py outside the sandbox",
  "S-M2: sandbox-exec inside sandbox-exec fails (sandbox_apply: Operation not permitted, exit 71)",
  "S-M3: bind filter accepts only * or localhost and limits the port only",
  "S-M2b: outbound (remote ip \"localhost:<port>\") limits the address to loopback",
  "P4-5: launchd agents start after reboot and auto login; keychain access for claude, codex and the App token",
]
